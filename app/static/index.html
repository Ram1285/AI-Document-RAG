<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>DocuChat</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a36;
      --muted: #728093;
      --line: #e3e8ee;
      --paper: #ffffff;
      --canvas: #f6f7f9;
      --accent: #326b59;
      --accent-dark: #285646;
      --soft-green: #edf5f0;
      --danger: #a64040;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100% - 36px, 720px); margin: 0 auto; padding: 58px 0 72px; }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 42px; }
    .brand-mark {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      color: white; background: var(--accent); font-size: 19px; font-weight: 700;
    }
    .brand-name { font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); line-height: 1.2; letter-spacing: -.04em; font-weight: 650; }
    .intro { margin: 10px 0 27px; color: var(--muted); font-size: 16px; }
    .panel { padding: 23px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 4px 18px #25364a08; }
    .section-label { display: block; margin-bottom: 12px; color: #485667; font-size: 13px; font-weight: 650; }
    .upload-row { display: flex; align-items: center; gap: 12px; }
    .file-picker { min-width: 0; flex: 1; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: white; font: inherit; }
    input[type="file"]::file-selector-button { margin-right: 12px; padding: 7px 10px; border: 0; border-radius: 6px; background: #f0f2f4; color: var(--ink); font: inherit; cursor: pointer; }
    button { border: 0; border-radius: 9px; padding: 11px 16px; background: var(--accent); color: white; font: inherit; font-weight: 600; cursor: pointer; transition: background .15s, opacity .15s; }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
    .notice { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
    .notice.show { display: block; }
    .notice.error { color: var(--danger); background: #fbefef; }
    .notice.success { color: var(--accent-dark); background: var(--soft-green); }
    #document-card { display: none; align-items: center; justify-content: space-between; gap: 16px; margin-top: 14px; padding: 14px 15px; border: 1px solid #dce9e0; border-radius: 11px; background: var(--soft-green); }
    #document-card.visible { display: flex; }
    .doc-name { overflow: hidden; color: #29493b; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .doc-meta { margin-top: 2px; color: #668071; font-size: 12px; }
    .ready { flex: 0 0 auto; color: var(--accent-dark); font-size: 12px; font-weight: 650; }
    .divider { height: 1px; margin: 25px 0; background: var(--line); }
    #ask-section { opacity: .48; transition: opacity .2s; }
    #ask-section.enabled { opacity: 1; }
    .question-row { display: flex; align-items: end; gap: 10px; }
    textarea { display: block; width: 100%; min-height: 48px; max-height: 150px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 9px; outline: none; color: var(--ink); background: white; font: inherit; }
    textarea:focus, .file-picker:focus-visible { border-color: #78a391; box-shadow: 0 0 0 3px #326b5915; }
    #answer-card { display: none; margin-top: 18px; padding: 17px; border: 1px solid var(--line); border-radius: 11px; background: #fbfcfd; }
    #answer-card.visible { display: block; }
    .answer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .answer-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .copy-button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: white; color: #566577; font-size: 12px; font-weight: 600; }
    .copy-button:hover:not(:disabled) { border-color: #b9c6d2; background: #f3f5f7; color: var(--ink); }
    #answer { color: var(--ink); }
    #answer p { margin: 0 0 12px; }
    #answer p:last-child { margin-bottom: 0; }
    #answer h3, #answer h4, #answer h5 { margin: 18px 0 8px; color: #2b3a47; line-height: 1.3; letter-spacing: -.01em; }
    #answer h3 { font-size: 17px; }
    #answer h4 { font-size: 15.5px; }
    #answer h5 { font-size: 14.5px; }
    #answer h3:first-child, #answer h4:first-child, #answer h5:first-child { margin-top: 0; }
    #answer ul, #answer ol { margin: 0 0 12px; padding-left: 21px; }
    #answer li { margin: 6px 0; padding-left: 2px; }
    #answer li::marker { color: var(--accent); font-weight: 650; }
    #answer strong { color: #22303d; font-weight: 650; }
    #answer code { padding: 1px 5px; border-radius: 4px; background: #edf0f3; color: #33475a; font-size: 13px; }
    #answer .cite { display: inline-block; margin-left: 2px; color: var(--accent-dark); font-size: 11px; font-weight: 650; vertical-align: super; }
    details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
    summary { color: #566577; font-size: 13px; cursor: pointer; }
    .source { margin-top: 10px; padding: 11px 12px; border-left: 2px solid #9ab7a7; border-radius: 0 8px 8px 0; background: white; color: #596778; font-size: 13px; }
    .source-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; }
    .source-title { overflow: hidden; max-width: 100%; color: #33475a; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .source-meta { flex: 0 0 auto; color: #7b8a9a; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
    .source-text { line-height: 1.5; white-space: pre-wrap; }
    footer { margin-top: 18px; color: #8a96a5; text-align: center; font-size: 12px; }
    @media (max-width: 560px) {
      main { padding-top: 32px; }
      .brand { margin-bottom: 32px; }
      .panel { padding: 17px; }
      .upload-row { align-items: stretch; flex-direction: column; }
      .question-row { align-items: stretch; flex-direction: column; }
      .question-row button { align-self: flex-end; }
      #document-card { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand" aria-label="DocuChat home">
      <div class="brand-mark" aria-hidden="true">D</div>
      <div class="brand-name">DocuChat</div>
    </header>

    <h1>Ask your document</h1>
    <p class="intro">Upload a file, then get answers grounded in its contents.</p>

    <section class="panel" aria-label="Document upload and questions">
      <form id="upload-form">
        <label class="section-label" for="file-input">Your document</label>
        <div class="upload-row">
          <input class="file-picker" id="file-input" name="file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required />
          <button id="upload-button" type="submit">Upload document</button>
        </div>
        <p class="hint">PDF or DOCX · Up to 10 MB</p>
      </form>
      <div id="upload-notice" class="notice" role="status" aria-live="polite"></div>
      <div id="document-card" aria-live="polite">
        <div style="min-width:0">
          <div id="doc-name" class="doc-name"></div>
          <div id="doc-meta" class="doc-meta"></div>
        </div>
        <div class="ready">Ready to ask</div>
      </div>

      <div class="divider"></div>

      <form id="ask-section">
        <label class="section-label" for="question-input">Ask a question</label>
        <div class="question-row">
          <textarea id="question-input" placeholder="What is this document about?" minlength="3" required disabled></textarea>
          <button id="ask-button" type="submit" disabled>Ask</button>
        </div>
        <p class="hint">Press Enter to ask · Shift+Enter for a new line</p>
      </form>
      <div id="answer-card" aria-live="polite">
        <div class="answer-head">
          <div class="answer-label">Answer</div>
          <button type="button" class="copy-button" id="copy-answer">Copy</button>
        </div>
        <div id="answer"></div>
        <details id="sources-details">
          <summary id="sources-summary">Sources</summary>
          <div id="sources"></div>
        </details>
      </div>
      <div id="query-notice" class="notice" role="status" aria-live="polite"></div>
    </section>
    <footer>Your files stay in this app's configured storage.</footer>
  </main>

  <script>
    const uploadForm = document.getElementById('upload-form');
    const fileInput = document.getElementById('file-input');
    const uploadButton = document.getElementById('upload-button');
    const uploadNotice = document.getElementById('upload-notice');
    const documentCard = document.getElementById('document-card');
    const askForm = document.getElementById('ask-section');
    const questionInput = document.getElementById('question-input');
    const askButton = document.getElementById('ask-button');
    const answerCard = document.getElementById('answer-card');
    const copyButton = document.getElementById('copy-answer');
    let activeDocumentId = null;
    let lastAnswer = '';

    function escapeHtml(text) {
      const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return text.replace(/[&<>"']/g, (character) => entities[character]);
    }

    function renderInline(text) {
      return escapeHtml(text)
        .replace(/`([^`\n]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n');
      const html = [];
      let list = null;
      let paragraph = [];

      function closeList() {
        if (list) {
          html.push(`</${list}>`);
          list = null;
        }
      }

      function flushParagraph() {
        if (paragraph.length) {
          html.push(`<p>${renderInline(paragraph.join(' '))}</p>`);
          paragraph = [];
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          flushParagraph();
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const tag = heading[1].length === 1 ? 'h3' : heading[1].length === 2 ? 'h4' : 'h5';
          html.push(`<${tag}>${renderInline(heading[2])}</${tag}>`);
          continue;
        }

        const bullet = line.match(/^[-*•]\s+(.*)$/);
        if (bullet) {
          flushParagraph();
          if (list !== 'ul') {
            closeList();
            html.push('<ul>');
            list = 'ul';
          }
          html.push(`<li>${renderInline(bullet[1])}</li>`);
          continue;
        }

        const numbered = line.match(/^\d+[.)]\s+(.*)$/);
        if (numbered) {
          flushParagraph();
          if (list !== 'ol') {
            closeList();
            html.push('<ol>');
            list = 'ol';
          }
          html.push(`<li>${renderInline(numbered[1])}</li>`);
          continue;
        }

        if (list) closeList();
        paragraph.push(line);
      }

      flushParagraph();
      closeList();
      return html.join('');
    }

    function showNotice(element, message, type) {
      element.textContent = message;
      element.className = `notice show ${type}`;
    }

    async function readError(response) {
      try {
        const body = await response.json();
        return body.detail || body.message || JSON.stringify(body);
      } catch {
        return `Request failed (${response.status}).`;
      }
    }

    copyButton.addEventListener('click', async () => {
      if (!lastAnswer) return;
      try {
        await navigator.clipboard.writeText(lastAnswer);
        copyButton.textContent = 'Copied';
        setTimeout(() => { copyButton.textContent = 'Copy'; }, 1600);
      } catch {
        copyButton.textContent = 'Copy failed';
      }
    });

    questionInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
      event.preventDefault();
      if (!askButton.disabled) askForm.requestSubmit();
    });

    uploadForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!fileInput.files.length) return;
      uploadButton.disabled = true;
      uploadButton.textContent = 'Processing…';
      uploadNotice.className = 'notice';
      documentCard.classList.remove('visible');
      askForm.classList.remove('enabled');
      answerCard.classList.remove('visible');
      activeDocumentId = null;

      try {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const response = await fetch('/documents/upload?process=true', { method: 'POST', body: formData });
        if (!response.ok) throw new Error(await readError(response));
        const result = await response.json();
        const doc = result.document;
        activeDocumentId = doc.id;
        document.getElementById('doc-name').textContent = doc.original_filename;
        document.getElementById('doc-meta').textContent = `${doc.page_count} page${doc.page_count === 1 ? '' : 's'} · ${doc.chunk_count} text sections`;
        documentCard.classList.add('visible');
        askForm.classList.add('enabled');
        questionInput.disabled = false;
        askButton.disabled = false;
        questionInput.focus();
        showNotice(uploadNotice, 'Your document is uploaded and ready.', 'success');
      } catch (error) {
        showNotice(uploadNotice, error.message || 'Could not upload this document.', 'error');
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = 'Upload document';
      }
    });

    askForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question || !activeDocumentId) return;
      askButton.disabled = true;
      askButton.textContent = 'Thinking…';
      document.getElementById('query-notice').className = 'notice';
      answerCard.classList.remove('visible');

      try {
        const response = await fetch('/rag/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, document_id: activeDocumentId, top_k: 4 })
        });
        if (!response.ok) throw new Error(await readError(response));
        const result = await response.json();
        lastAnswer = result.answer;
        document.getElementById('answer').innerHTML = renderMarkdown(result.answer);
        const sources = document.getElementById('sources');
        sources.replaceChildren();
        result.sources.forEach((source, index) => {
          const item = document.createElement('div');
          item.className = 'source';

          const head = document.createElement('div');
          head.className = 'source-head';
          const title = document.createElement('span');
          title.className = 'source-title';
          title.textContent = `${index + 1}. ${source.filename}`;

          const meta = document.createElement('span');
          meta.className = 'source-meta';
          const details = [];
          if (source.page_number) details.push(`page ${source.page_number}`);
          if (typeof source.score === 'number') {
            details.push(`${Math.round(Math.max(0, Math.min(1, source.score)) * 100)}% match`);
          }
          meta.textContent = details.join(' · ');

          const text = document.createElement('div');
          text.className = 'source-text';
          text.textContent = source.text;

          head.append(title, meta);
          item.append(head, text);
          sources.appendChild(item);
        });
        document.getElementById('sources-summary').textContent = `Sources (${result.sources.length})`;
        document.getElementById('sources-details').style.display = result.sources.length ? 'block' : 'none';
        document.getElementById('sources-details').open = false;
        copyButton.textContent = 'Copy';
        answerCard.classList.add('visible');
      } catch (error) {
        showNotice(document.getElementById('query-notice'), error.message || 'Could not get an answer.', 'error');
      } finally {
        askButton.disabled = false;
        askButton.textContent = 'Ask';
      }
    });
  </script>
</body>
</html>
